# Switchyard mode router.
#
# Binds loopback only. Nothing here terminates TLS or authenticates callers —
# Switchyard has no inbound auth of its own, so do not publish port 4000 on a
# public interface.
#
# One-time, before the first `up` — these volumes are deliberately NOT owned by
# this project, so deleting this directory or running `down -v` cannot destroy
# your key, your model choices, or your accounting history:
#
#   docker volume create switchyard-config
#   docker volume create switchyard-logs
#
#   docker compose run --rm switchingyard manage      <- set key, models, everything
#   docker compose up -d

name: switchingyard       # explicit, so the project is not named after the directory

# One source of truth for where the router is reachable. Used both as the
# published port and as what the TUI reports, so they cannot drift apart.
# Change it here and nowhere else. Keep the host part on loopback.
x-published: &published "127.0.0.1:4000:4000"

x-common: &common
  image: switchingyard-mode-router:local
  volumes:
    - switchyard-config:/data
    - switchyard-logs:/var/log/switchyard
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  restart: unless-stopped

services:
  switchingyard:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - --config=/data/routes.toml
      - --host=0.0.0.0
      - --port=4000
      - --routing-log-file=/var/log/switchyard/routing.jsonl
    environment:
      # No key here and none anywhere: every caller presents their own and it
      # is relayed upstream. Routing decisions and judge failures are only
      # visible at debug.
      RUST_LOG: switchyard_server=info,libsy=info
      # so `manage` can report the address to point a reverse proxy at
      SWITCHYARD_PUBLISHED: *published
    # No ports: the router is NOT published. It is reachable only from the
    # gateway, on the compose network. That is what makes the token mandatory
    # rather than merely advisory.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # so `docker compose run --rm switchingyard manage` gets a usable terminal
    stdin_open: true
    tty: true

  # The only published service. Checks the bearer token, then forwards to the
  # router. Point your reverse proxy here; it needs no auth config of its own.
  #
  # Caddy rather than something hand-written: HTTP parsing, framing, timeouts
  # and streaming are where a bespoke proxy goes wrong, and this is the part
  # facing the network. Its config is generated by the TUI; admission itself is
  # delegated to the authcheck service, so no credential appears in it.
  gateway:
    image: caddy:2.11.4-alpine
    depends_on:
      switchingyard:
        condition: service_healthy      # guarantees /data/Caddyfile is generated
      authcheck:
        condition: service_started      # admission must exist before the door opens
    command: ["caddy", "run", "--config", "/etc/switchyard/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      # NOT /data: the caddy image sets XDG_DATA_HOME=/data for its own storage,
      # and mounting our config there read-only makes Caddy log errors trying to
      # write its lock and instance-id files.
      - switchyard-config:/etc/switchyard:ro
      - switchyard-logs:/var/log/switchyard      # Caddy writes and rolls its access log here
    networks:
      default:
      # ONLY the gateway joins the shared bridge. The router and the sidecar stay
      # on the private default network, so nothing on `proxy` can reach the
      # unauthenticated router — the token check cannot be walked around.
      proxy:
        aliases:
          # distinct alias: `gateway` is far too generic for a shared bridge
          - switchyard-gateway
    ports:
      - *published
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Membership check for the gateway: SHA-256 digests only, no keys. Internal
  # only — nothing but the gateway may reach it. If it is down, forward_auth
  # gets a non-2xx and every request is denied, which is the right direction.
  authcheck:
    <<: *common
    command: ["authcheck"]
    healthcheck:
      # Asserts that it ANSWERS, not that it authorises. An unauthenticated
      # probe is a 401 by design, so `curl -f` could only ever pass here if the
      # checker failed open — which is the one thing it must never do.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/auth | grep -q 401"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Prices the routing log into /data/accounting.db and rotates the log once
  # aggregated. Sees no request traffic — it only reads a file.
  accounting:
    <<: *common
    depends_on: [switchingyard]
    entrypoint: ["entrypoint.sh"]
    command: ["ingest", "--loop", "300"]

networks:
  # per-project, private: router + accounting sidecar only
  default:
  # the shared bridge NPM lives on, created by the docker/ infra stack or with
  # `docker network create proxy`. NPM resolves `switchyard-gateway` on it.
  proxy:
    external: true
    name: proxy

volumes:
  # external: compose attaches but never creates or destroys these, so
  # `docker compose down -v` cannot delete them and this directory stays
  # disposable. Create them once with `docker volume create <name>`.
  switchyard-config:
    external: true
  switchyard-logs:
    external: true
